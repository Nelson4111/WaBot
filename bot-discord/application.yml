server:
  port: 5006
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    # YouTube Source Plugin Resmi Lavalink (Versi Terbaru)
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.13.5"
      repository: "https://maven.lavalink.dev/releases"

  server:
    password: "youshallnotpass"
    sources:
      # Matikan youtube internal lama karena sudah digantikan oleh youtube-plugin
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 8
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5
    youtubePlaylistLoadLimit: 6
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - TV
      - WEB
      - ANDROID_VR
      - WEBEMBEDDED
      - MWEB
      - TVHTML5_SIMPLY
      - ANDROID
    clientOptions:
      MUSIC:
        playback: false
        videoLoading: false
        searching: true
        playlistLoading: true
      TV:
        playback: true
        videoLoading: true
        searching: false
        playlistLoading: false
      WEB:
        playback: true
        videoLoading: true
        searching: true
        playlistLoading: true
      ANDROID_VR:
        playback: true
        videoLoading: true
        searching: true
        playlistLoading: true
      WEBEMBEDDED:
        playback: true
        videoLoading: true
        searching: false
        playlistLoading: false
      MWEB:
        playback: true
        videoLoading: true
        searching: true
        playlistLoading: true
      TVHTML5_SIMPLY:
        playback: true
        videoLoading: true
        searching: false
        playlistLoading: false
      ANDROID:
        playback: true
        videoLoading: true
        searching: false
        playlistLoading: false
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
      skipInitialization: true
    pot:
      token: "${YOUTUBE_POT_TOKEN:}"
      visitorData: "${YOUTUBE_VISITOR_DATA:}"
  lavasrc:
    providers:
      - "dzisrc:%ISRC%"
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
      - "ymsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: true
    spotify:
      clientId: "85aab1d51a174aad9eed6d7989f530e6"
      clientSecret: "b2ad05aa725e434c88776a1be8eab6c"
      countryCode: "ID"
      playlistLoadLimit: 6
      albumLoadLimit: 6

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/lavalink.log
  level:
    root: INFO
    lavalink: INFO
    # Pastikan log level INFO untuk mencetak link & kode OAuth
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
