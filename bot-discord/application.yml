server:
  port: 5006
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    # YouTube Source Plugin Resmi Lavalink (Versi Terbaru)
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.13.5"
      repository: "https://maven.lavalink.dev/releases"

  server:
    password: "youshallnotpass"
    sources:
      # Matikan youtube internal lama karena sudah digantikan oleh youtube-plugin
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - TV
      - MUSIC
      - ANDROID_VR
      - WEBEMBEDDED
      - MWEB
      - WEB
    clientOptions:
      TV:
        playback: true
        videoLoading: true
        searching: false
        playlistLoading: false
      MUSIC:
        playback: true
        videoLoading: true
        searching: true
        playlistLoading: true
      ANDROID_VR:
        playback: true
        videoLoading: true
        searching: true
        playlistLoading: true
      WEBEMBEDDED:
        playback: true
        videoLoading: true
        searching: false
        playlistLoading: false
      MWEB:
        playback: true
        videoLoading: true
        searching: true
        playlistLoading: true
      WEB:
        playback: true
        videoLoading: true
        searching: true
        playlistLoading: true
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
      skipInitialization: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/lavalink.log
  level:
    root: INFO
    lavalink: INFO
    # Pastikan log level INFO untuk mencetak link & kode OAuth
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
